<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Fullscreen Camera Only</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }

  /* Fullscreen camera */
  #cam {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 1;
  }

  /* Canvas overlay for VR split-screen */
  #view {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 2;
    pointer-events: none;
  }

  #hud {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.6);
    padding: 8px 12px;
    border-radius: 6px;
    color: white;
    font-family: Arial;
    z-index: 3;
  }
</style>
</head>
<body>

<div id="hud">
  <div>v1.0.0-vr-camera</div>
  <div id="fps">FPS: 0</div>
</div>

<video id="cam" autoplay playsinline muted></video>
<canvas id="view" width="1280" height="720"></canvas>

<script>
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const fpsEl = document.getElementById("fps");
const video = document.getElementById("cam");

let lastTime = performance.now();
let frames = 0;

// Start camera
document.body.addEventListener("click", async () => {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });
  video.srcObject = stream;
  startLoop();
});

function updateFPS(now) {
  frames++;
  if (now - lastTime >= 1000) {
    fpsEl.textContent = "FPS: " + frames;
    frames = 0;
    lastTime = now;
  }
}

function startLoop() {
  function loop(now) {
    updateFPS(now);

    if (video.readyState >= 2) {
      drawVR();
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

function drawVR() {
  const w = canvas.width;
  const h = canvas.height;
  const half = w / 2;

  ctx.clearRect(0, 0, w, h);

  // VR split-screen
  ctx.drawImage(video, 0, 0, half, h);
  ctx.drawImage(video, half, 0, half, h);
}
</script>

</body>
</html>
