<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Motion Hand Detection</title>
<style>
  body { margin: 0; overflow: hidden; background: black; color: white; font-family: Arial; }
  #view { width: 100vw; height: 100vh; display: block; }
  #ui {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px;
  }
</style>
</head>
<body>

<div id="ui">
  <div>VR Motion Hand Detection</div>
  <div id="status">Tap screen to start camera…</div>
</div>

<canvas id="view" width="1280" height="720"></canvas>

<script>
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

// ------------------------------
// WORKING CAMERA CODE
// ------------------------------
const video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;
video.muted = true;

video.style.position = "absolute";
video.style.top = "0";
video.style.left = "0";
video.style.width = "100vw";
video.style.height = "100vh";
video.style.opacity = "0";
video.style.pointerEvents = "none";

document.body.appendChild(video);

// Start camera on tap
document.body.addEventListener("click", async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;
    statusEl.textContent = "Camera OK — detecting motion…";

    startDetection();
  } catch (err) {
    statusEl.textContent = "Camera error: " + err.name;
  }
});

// ------------------------------
// MOTION-BASED HAND DETECTION
// ------------------------------
let lastFrame = null;

function startDetection() {
  function loop() {
    if (video.readyState >= 2) {
      detectMotion();
    }
    requestAnimationFrame(loop);
  }
  loop();
}

function detectMotion() {
  const w = canvas.width;
  const h = canvas.height;
  const half = w / 2;

  // Draw split-screen video
  ctx.drawImage(video, 0, 0, half, h);
  ctx.drawImage(video, half, 0, half, h);

  // Get current frame
  const frame = ctx.getImageData(0, 0, w, h);

  if (!lastFrame) {
    lastFrame = frame;
    return;
  }

  const motionMask = new Uint8ClampedArray(w * h);

  let minX = w, minY = h, maxX = 0, maxY = 0;

  // Compare frames
  for (let i = 0; i < frame.data.length; i += 4) {
    const diff =
      Math.abs(frame.data[i] - lastFrame.data[i]) +
      Math.abs(frame.data[i+1] - lastFrame.data[i+1]) +
      Math.abs(frame.data[i+2] - lastFrame.data[i+2]);

    const idx = i / 4;

    if (diff > 40) { // motion threshold
      motionMask[idx] = 255;

      const x = idx % w;
      const y = Math.floor(idx / w);

      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
  }

  lastFrame = frame;

  // Draw motion outline
  if (maxX - minX > 20 && maxY - minY > 20) {
    ctx.strokeStyle = "cyan";
    ctx.lineWidth = 4;
    ctx.strokeRect(minX, minY, maxX - minX, maxY - minY);
  }
}
</script>

</body>
</html>
