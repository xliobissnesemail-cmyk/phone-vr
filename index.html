<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Joy-Con Rotation Aiming (No Controller Model)</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }

  #cam {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: cover;
    z-index: 0;
  }

  #view {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
    pointer-events: none;
  }

  #hud {
    position: fixed;
    top: 10px; left: 10px;
    background: rgba(0,0,0,0.6);
    padding: 10px 15px;
    border-radius: 6px;
    color: white;
    font-family: Arial;
    z-index: 2;
    font-size: 18px;
  }
</style>
</head>
<body>

<div id="hud">
  <div id="status">Waiting for Joy-Cons...</div>
  <div id="msg">Press any button...</div>
  <div id="aim">Rotation: yaw=0 pitch=0 roll=0</div>
</div>

<video id="cam" autoplay playsinline muted></video>
<canvas id="view" width="1280" height="720"></canvas>

<script>
const video = document.getElementById("cam");
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");

const statusEl = document.getElementById("status");
const msgEl = document.getElementById("msg");
const aimEl = document.getElementById("aim");

let leftCon = null;
let rightCon = null;

// Rotation fallback
let rightRot = { yaw: 0, pitch: 0, roll: 0 };

// CAMERA START
document.body.addEventListener("click", async () => {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });
  video.srcObject = stream;
  startLoop();
});

// GAMEPAD CONNECT
window.addEventListener("gamepadconnected", (e) => {
  const pad = e.gamepad;

  if (pad.id.includes("Joy-Con (L)")) {
    leftCon = pad;
    statusEl.textContent = "Left Joy-Con connected!";
  }

  if (pad.id.includes("Joy-Con (R)")) {
    rightCon = pad;
    statusEl.textContent = "Right Joy-Con connected!";
  }
});

// BUTTON NAMES
const joyConButtons = [
  "Button 0",
  "Button 1",
  "Button 2",
  "Button 3",
  "SL",
  "SR",
  "Stick Press"
];

// READ JOY-CONS
function readJoyCons() {
  const pads = navigator.getGamepads();

  for (const pad of pads) {
    if (!pad) continue;

    let side = pad.id.includes("Joy-Con (L)") ? "Left" :
               pad.id.includes("Joy-Con (R)") ? "Right" : "Unknown";

    // BUTTONS
    pad.buttons.forEach((btn, index) => {
      if (btn.pressed) {
        const name = joyConButtons[index] || `Button ${index}`;
        msgEl.textContent = `Button ${name} was pressed on Joy-Con ${side}`;
      }
    });

    // ROTATION (if supported)
    if (side === "Right") {
      if (pad.pose && pad.pose.orientation) {
        rightRot = quaternionToEuler(pad.pose.orientation);
      } else {
        // fallback: joystick rotates aim
        const stickX = pad.axes[0];
        rightRot.yaw += stickX * 0.05;
      }
    }
  }

  aimEl.textContent =
    `Rotation: yaw=${rightRot.yaw.toFixed(2)} pitch=${rightRot.pitch.toFixed(2)} roll=${rightRot.roll.toFixed(2)}`;
}

// QUATERNION → EULER
function quaternionToEuler(q) {
  const yaw = Math.atan2(
    2 * (q.w * q.z + q.x * q.y),
    1 - 2 * (q.y * q.y + q.z * q.z)
  );

  const pitch = Math.asin(
    2 * (q.w * q.y - q.z * q.x)
  );

  const roll = Math.atan2(
    2 * (q.w * q.x + q.y * q.z),
    1 - 2 * (q.x * q.x + q.y * q.y)
  );

  return { yaw, pitch, roll };
}

// VR DRAW LOOP
function drawVR() {
  const w = canvas.width;
  const h = canvas.height;
  const half = w / 2;

  ctx.clearRect(0, 0, w, h);

  // VR split-screen camera
  ctx.drawImage(video, 0, 0, half, h);
  ctx.drawImage(video, half, 0, half, h);

  // No controller model drawn
}

// MAIN LOOP
function startLoop() {
  function loop() {
    readJoyCons();
    drawVR();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
</script>

</body>
</html>
