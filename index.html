<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR 3D World</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  #view {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
  }
</style>
</head>
<body>

<canvas id="view"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas });
renderer.setSize(window.innerWidth, window.innerHeight);

// 3D scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 1.6, 3);

// Floor
const floorGeo = new THREE.PlaneGeometry(50, 50);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Cube
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const cubeMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
const cube = new THREE.Mesh(cubeGeo, cubeMat);
cube.position.set(0, 1, -3);
scene.add(cube);

// Light
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);

// Movement
let forward = 0;
let strafe = 0;

window.addEventListener("keydown", (e) => {
  if (e.key === "w") forward = 0.1;
  if (e.key === "s") forward = -0.1;
  if (e.key === "a") strafe = -0.1;
  if (e.key === "d") strafe = 0.1;
});

window.addEventListener("keyup", () => {
  forward = 0;
  strafe = 0;
});

// Gyro look
let yaw = 0, pitch = 0;

window.addEventListener("deviceorientation", (e) => {
  yaw = (e.alpha || 0) * Math.PI/180;
  pitch = (e.beta || 0) * Math.PI/180 - Math.PI/2;
});

// Render loop
function render() {
  // Apply rotation
  camera.rotation.set(pitch, yaw, 0);

  // Apply movement
  camera.position.x += Math.sin(yaw) * forward + Math.cos(yaw) * strafe;
  camera.position.z += Math.cos(yaw) * forward - Math.sin(yaw) * strafe;

  // VR split-screen
  const w = window.innerWidth;
  const h = window.innerHeight;

  renderer.setViewport(0, 0, w/2, h);
  renderer.render(scene, camera);

  renderer.setViewport(w/2, 0, w/2, h);
  renderer.render(scene, camera);

  requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
