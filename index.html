<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Multi-Hand Skeleton Detector</title>
<style>
  body { margin: 0; overflow: hidden; background: black; color: white; font-family: Arial; }
  #view { width: 100vw; height: 100vh; display: block; }
  #hud {
    position: fixed; top: 10px; right: 10px; z-index: 10;
    background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px;
    font-size: 14px; text-align: right;
  }
</style>
</head>
<body>

<div id="hud">
  <div id="version">v3.0.0-multi-hand-skeleton</div>
  <div id="fps">FPS: 0</div>
</div>

<canvas id="view" width="1280" height="720"></canvas>

<script>
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const fpsEl = document.getElementById("fps");

// Camera setup
const video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;
video.muted = true;
video.style.position = "absolute";
video.style.opacity = "0";
document.body.appendChild(video);

// Processing canvas
const proc = document.createElement("canvas");
proc.width = 320;
proc.height = 180;
const pctx = proc.getContext("2d");

let lastTime = performance.now();
let frameCount = 0;

// Start camera on tap
document.body.addEventListener("click", async () => {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });
  video.srcObject = stream;
  startLoop();
});

function updateFPS(now) {
  frameCount++;
  const dt = now - lastTime;
  if (dt >= 1000) {
    fpsEl.textContent = "FPS: " + Math.round((frameCount * 1000) / dt);
    frameCount = 0;
    lastTime = now;
  }
}

function startLoop() {
  function loop(now) {
    updateFPS(now);
    detectHands();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

function detectHands() {
  const w = canvas.width;
  const h = canvas.height;
  const half = w / 2;

  // Draw split-screen VR
  ctx.drawImage(video, 0, 0, half, h);
  ctx.drawImage(video, half, 0, half, h);

  // Downscale for processing
  pctx.drawImage(video, 0, 0, proc.width, proc.height);
  const frame = pctx.getImageData(0, 0, proc.width, proc.height);
  const data = frame.data;

  // Edge detection
  const edges = [];
  for (let y = 1; y < proc.height - 1; y++) {
    for (let x = 1; x < proc.width - 1; x++) {
      const i = (y * proc.width + x) * 4;

      const gx =
        -data[i - 4] + data[i + 4] +
        -2 * data[i - 4 * proc.width] + 2 * data[i + 4 * proc.width];

      const gy =
        -data[i - 4 * proc.width] - 2 * data[i - 4] +
         data[i + 4 * proc.width] + 2 * data[i + 4];

      const mag = Math.abs(gx) + Math.abs(gy);

      if (mag > 80) edges.push({ x, y });
    }
  }

  if (edges.length < 20) return;

  // Cluster edges into multiple blobs (hands)
  const blobs = clusterPoints(edges, 25);

  // For each blob, compute convex hull and draw skeleton
  for (let blob of blobs) {
    if (blob.length < 30) continue;

    const hull = convexHull(blob);
    drawSkeleton(hull);
  }
}

function clusterPoints(points, dist) {
  const clusters = [];

  for (let p of points) {
    let found = false;

    for (let c of clusters) {
      for (let q of c) {
        const dx = p.x - q.x;
        const dy = p.y - q.y;
        if (dx * dx + dy * dy < dist * dist) {
          c.push(p);
          found = true;
          break;
        }
      }
      if (found) break;
    }

    if (!found) clusters.push([p]);
  }

  return clusters;
}

function convexHull(points) {
  let hull = [];
  let left = points.reduce((a, b) => (a.x < b.x ? a : b));

  let current = left;
  let next;

  do {
    hull.push(current);
    next = points[0];

    for (let p of points) {
      const cross =
        (next.x - current.x) * (p.y - current.y) -
        (next.y - current.y) * (p.x - current.x);

      if (next === current || cross < 0) next = p;
    }

    current = next;
  } while (current !== left);

  return hull;
}

function drawSkeleton(hull) {
  const scaleX = canvas.width / proc.width;
  const scaleY = canvas.height / proc.height;

  // Palm center
  let cx = 0, cy = 0;
  for (let p of hull) {
    cx += p.x;
    cy += p.y;
  }
  cx /= hull.length;
  cy /= hull.length;

  cx *= scaleX;
  cy *= scaleY;

  // Draw palm center
  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(cx, cy, 10, 0, Math.PI * 2);
  ctx.fill();

  // Draw bones
  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;

  for (let p of hull) {
    const x = p.x * scaleX;
    const y = p.y * scaleY;

    // fingertip
    ctx.fillStyle = "cyan";
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();

    // bone
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.stroke();
  }
}
</script>

</body>
</html>
