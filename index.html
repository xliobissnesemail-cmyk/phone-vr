<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Joy-Con Button Tester</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }

  #cam {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: cover;
    z-index: 0;
  }

  #view {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
    pointer-events: none;
  }

  #hud {
    position: fixed;
    top: 10px; left: 10px;
    background: rgba(0,0,0,0.6);
    padding: 10px 15px;
    border-radius: 6px;
    color: white;
    font-family: Arial;
    z-index: 2;
    font-size: 18px;
  }
</style>
</head>
<body>

<div id="hud">
  <div id="status">Waiting for Joy-Cons...</div>
  <div id="msg">Press any button...</div>
</div>

<video id="cam" autoplay playsinline muted></video>
<canvas id="view" width="1280" height="720"></canvas>

<script>
const video = document.getElementById("cam");
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");

const statusEl = document.getElementById("status");
const msgEl = document.getElementById("msg");

let leftCon = null;
let rightCon = null;

// CAMERA START
document.body.addEventListener("click", async () => {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });
  video.srcObject = stream;
  startLoop();
});

// GAMEPAD CONNECT
window.addEventListener("gamepadconnected", (e) => {
  const pad = e.gamepad;

  if (pad.id.includes("Joy-Con (L)")) {
    leftCon = pad;
    statusEl.textContent = "Left Joy-Con connected!";
  }

  if (pad.id.includes("Joy-Con (R)")) {
    rightCon = pad;
    statusEl.textContent = "Right Joy-Con connected!";
  }
});

// BUTTON NAMES FOR JOY-CONS
const joyConButtons = [
  "Button 0",
  "Button 1",
  "Button 2",
  "Button 3",
  "SL",
  "SR",
  "Stick Press",
  "Unknown",
  "Unknown",
  "Unknown",
  "Unknown",
  "Unknown"
];

// READ JOY-CON BUTTONS
function readJoyCons() {
  const pads = navigator.getGamepads();

  for (const pad of pads) {
    if (!pad) continue;

    let side = "Unknown";

    if (pad.id.includes("Joy-Con (L)")) side = "Left";
    if (pad.id.includes("Joy-Con (R)")) side = "Right";

    pad.buttons.forEach((btn, index) => {
      if (btn.pressed) {
        const name = joyConButtons[index] || `Button ${index}`;
        msgEl.textContent = `Button ${name} was pressed on Joy-Con ${side}`;
      }
    });
  }
}

// VR DRAW LOOP
function drawVR() {
  const w = canvas.width;
  const h = canvas.height;
  const half = w / 2;

  ctx.clearRect(0, 0, w, h);

  // VR split-screen camera
  ctx.drawImage(video, 0, 0, half, h);
  ctx.drawImage(video, half, 0, half, h);
}

// MAIN LOOP
function startLoop() {
  function loop() {
    readJoyCons();
    drawVR();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
</script>

</body>
</html>
