<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Hand Tracking (Manual Mobile Fix)</title>
<style>
  body { margin: 0; overflow: hidden; background: black; color: white; font-family: Arial; }
  #view { width: 100vw; height: 100vh; display: block; }
  #ui {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px;
  }
  #startBtn {
    position: fixed; bottom: 20px; left: 20px;
    opacity: 0; pointer-events: auto; z-index: 999;
  }
</style>
</head>
<body>

<div id="ui">
  <div>VR Hand Tracking</div>
  <div id="status">Tap screen to start camera…</div>
</div>

<button id="startBtn">Start Camera</button>

<canvas id="view" width="1280" height="720"></canvas>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

// ------------------------------
// MOBILE-SAFE VIDEO ELEMENT
// ------------------------------
const video = document.createElement("video");
video.setAttribute("playsinline", "");
video.setAttribute("autoplay", "");
video.muted = true;

// MUST be real size for mobile
video.style.position = "absolute";
video.style.top = "0";
video.style.left = "0";
video.style.width = "320px";
video.style.height = "240px";
video.style.opacity = "0";
video.style.pointerEvents = "none";

document.body.appendChild(video);

// ------------------------------
// Hidden Start Button
// ------------------------------
const startBtn = document.getElementById("startBtn");

startBtn.onclick = async () => {
  statusEl.textContent = "Starting camera…";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;

    statusEl.textContent = "Camera OK — starting hand tracking…";

    startHandTracking();
  } catch (err) {
    statusEl.textContent = "Camera error: " + err.name;
  }
};

// Auto-trigger hidden button when user taps screen
document.body.addEventListener("click", () => startBtn.click());

// ------------------------------
// MediaPipe Hands Setup
// ------------------------------
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(onHandsResults);

// ------------------------------
// MANUAL FRAME SENDING (Mobile Fix)
// ------------------------------
function startHandTracking() {
  function processFrame() {
    if (video.readyState >= 2) {
      hands.send({ image: video });
    }
    requestAnimationFrame(processFrame);
  }
  processFrame();
}

// ------------------------------
// DRAW HAND OUTLINES
// ------------------------------
function onHandsResults(results) {
  const width = canvas.width;
  const height = canvas.height;
  const half = width / 2;

  // Draw split-screen video
  ctx.clearRect(0, 0, width, height);

  if (results.image) {
    ctx.drawImage(results.image, 0, 0, half, height);
    ctx.drawImage(results.image, half, 0, half, height);
  }

  // Draw hand outlines
  if (results.multiHandLandmarks) {
    ctx.lineWidth = 4;
    ctx.strokeStyle = "cyan";
    ctx.fillStyle = "white";

    for (const landmarks of results.multiHandLandmarks) {
      drawHandOutline(landmarks, width, height);
    }
  }

  statusEl.textContent = "Hand tracking active";
}

function drawHandOutline(landmarks, width, height) {
  ctx.beginPath();
  for (let i = 0; i < landmarks.length; i++) {
    const x = landmarks[i].x * width;
    const y = landmarks[i].y * height;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  // Draw circles at each landmark
  for (let i = 0; i < landmarks.length; i++) {
    const x = landmarks[i].x * width;
    const y = landmarks[i].y * height;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}
</script>

</body>
</html>
