<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR MediaPipe Front Camera</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }

  #view {
    width: 100vw;
    height: 100vh;
    display: block;
    position: relative;
    z-index: 2;
  }

  /* Tiny visible camera feed */
  #cam {
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 80px;
    height: 60px;
    z-index: 3;
    opacity: 0.4; /* must be visible */
    border: 2px solid white;
    border-radius: 6px;
  }

  #hud {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.6);
    padding: 8px 12px;
    border-radius: 6px;
    color: white;
    font-family: Arial;
    z-index: 4;
  }
</style>
</head>
<body>

<div id="hud">
  <div>v6.0.0-mediapipe-frontcam</div>
  <div id="fps">FPS: 0</div>
</div>

<video id="cam" autoplay playsinline muted></video>
<canvas id="view" width="1280" height="720"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const fpsEl = document.getElementById("fps");
const video = document.getElementById("cam");

let lastTime = performance.now();
let frames = 0;

document.body.addEventListener("click", async () => {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" } // FRONT CAMERA FIX
  });
  video.srcObject = stream;
  startMediaPipe();
});

function updateFPS(now) {
  frames++;
  if (now - lastTime >= 1000) {
    fpsEl.textContent = "FPS: " + frames;
    frames = 0;
    lastTime = now;
  }
}

let hands;

function startMediaPipe() {
  hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7
  });

  hands.onResults(drawResults);

  loop();
}

function loop(now) {
  updateFPS(now);

  if (video.readyState >= 2) {
    hands.send({ image: video });
  }

  requestAnimationFrame(loop);
}

function drawResults(results) {
  const w = canvas.width;
  const h = canvas.height;
  const half = w / 2;

  // VR split-screen
  ctx.drawImage(video, 0, 0, half, h);
  ctx.drawImage(video, half, 0, half, h);

  // Draw skeleton
  if (results.multiHandLandmarks) {
    for (const lm of results.multiHandLandmarks) {
      drawingUtils.drawConnectors(ctx, lm, Hands.HAND_CONNECTIONS, {
        color: "cyan", lineWidth: 4
      });
      drawingUtils.drawLandmarks(ctx, lm, {
        color: "white", radius: 3
      });
    }
  }
}
</script>

</body>
</html>
