<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR MediaPipe Hand Tracking (Manual Fix)</title>
<style>
  body { margin: 0; overflow: hidden; background: black; color: white; font-family: Arial; }
  #view { width: 100vw; height: 100vh; display: block; }
  #ui {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px;
  }
</style>
</head>
<body>

<div id="ui">
  <div>VR MediaPipe Hand Tracking</div>
  <div id="status">Tap screen to start camera…</div>
</div>

<canvas id="view" width="1280" height="720"></canvas>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

// ------------------------------
// WORKING CAMERA CODE (Your phone supports this)
// ------------------------------
const video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;
video.muted = true;

// Must be real size for mobile
video.style.position = "absolute";
video.style.top = "0";
video.style.left = "0";
video.style.width = "100vw";
video.style.height = "100vh";
video.style.opacity = "0";
video.style.pointerEvents = "none";

document.body.appendChild(video);

// Start camera on tap
document.body.addEventListener("click", async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;
    statusEl.textContent = "Camera OK — loading MediaPipe…";

    startMediaPipe();
  } catch (err) {
    statusEl.textContent = "Camera error: " + err.name;
  }
});

// ------------------------------
// MEDIAPIPE HANDS (Manual frame sending)
// ------------------------------
let hands;

function startMediaPipe() {
  hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7
  });

  hands.onResults(onHandsResults);

  statusEl.textContent = "MediaPipe ready — detecting hands…";

  startManualLoop();
}

// ------------------------------
// MANUAL FRAME LOOP (Fix for mobile)
// ------------------------------
function startManualLoop() {
  async function loop() {
    if (video.readyState >= 2) {
      await hands.send({ image: video });
    }
    requestAnimationFrame(loop);
  }
  loop();
}

// ------------------------------
// DRAW HAND OUTLINES
// ------------------------------
function onHandsResults(results) {
  const w = canvas.width;
  const h = canvas.height;
  const half = w / 2;

  // Draw split-screen video
  ctx.drawImage(video, 0, 0, half, h);
  ctx.drawImage(video, half, 0, half, h);

  // Draw MediaPipe hand landmarks
  if (results.multiHandLandmarks) {
    for (const landmarks of results.multiHandLandmarks) {
      drawingUtils.drawConnectors(ctx, landmarks, Hands.HAND_CONNECTIONS, {
        color: "cyan", lineWidth: 4
      });
      drawingUtils.drawLandmarks(ctx, landmarks, {
        color: "white", radius: 3
      });
    }
  }

  statusEl.textContent = "Hand tracking active";
}
</script>

</body>
</html>
