<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Camera + MediaPipe Hands</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }

  /* Fullscreen camera */
  #cam {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: cover;
    z-index: 0;
  }

  /* Canvas overlay */
  #view {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
    pointer-events: none;
  }

  #hud {
    position: fixed;
    top: 10px; right: 10px;
    background: rgba(0,0,0,0.6);
    padding: 8px 12px;
    border-radius: 6px;
    color: white;
    font-family: Arial;
    z-index: 2;
  }
</style>
</head>
<body>

<div id="hud">
  <div>v2.0.0-vr-mediapipe</div>
  <div id="fps">FPS: 0</div>
</div>

<video id="cam" autoplay playsinline muted></video>
<canvas id="view" width="1280" height="720"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
const video = document.getElementById("cam");
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const fpsEl = document.getElementById("fps");

let lastTime = performance.now();
let frames = 0;

// Start camera
document.body.addEventListener("click", async () => {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });
  video.srcObject = stream;
  startMediaPipe();
});

function updateFPS(now) {
  frames++;
  if (now - lastTime >= 1000) {
    fpsEl.textContent = "FPS: " + frames;
    frames = 0;
    lastTime = now;
  }
}

let hands;

function startMediaPipe() {
  hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7
  });

  hands.onResults(drawResults);

  loop();
}

function loop(now) {
  updateFPS(now);

  if (video.readyState >= 2) {
    hands.send({ image: video });
  }

  requestAnimationFrame(loop);
}

function drawResults(results) {
  const w = canvas.width;
  const h = canvas.height;
  const half = w / 2;

  ctx.clearRect(0, 0, w, h);

  // VR split-screen
  ctx.drawImage(video, 0, 0, half, h);
  ctx.drawImage(video, half, 0, half, h);

  // Draw MediaPipe hands
  if (results.multiHandLandmarks) {
    for (const lm of results.multiHandLandmarks) {
      drawingUtils.drawConnectors(ctx, lm, Hands.HAND_CONNECTIONS, {
        color: "cyan", lineWidth: 4
      });
      drawingUtils.drawLandmarks(ctx, lm, {
        color: "white", radius: 3
      });
    }
  }
}
</script>

</body>
</html>
