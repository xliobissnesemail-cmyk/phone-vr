<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Simple Hand Detection</title>
<style>
  body { margin: 0; overflow: hidden; background: black; color: white; font-family: Arial; }
  #view { width: 100vw; height: 100vh; display: block; }
  #ui {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px;
  }
</style>
</head>
<body>

<div id="ui">
  <div>VR Simple Hand Detection</div>
  <div id="status">Tap screen to start camera…</div>
</div>

<canvas id="view" width="1280" height="720"></canvas>

<script>
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

// ------------------------------
// MOBILE-SAFE VIDEO ELEMENT
// ------------------------------
const video = document.createElement("video");
video.setAttribute("playsinline", "");
video.setAttribute("autoplay", "");
video.muted = true;

video.style.position = "absolute";
video.style.top = "0";
video.style.left = "0";
video.style.width = "320px";
video.style.height = "240px";
video.style.opacity = "0";
video.style.pointerEvents = "none";

document.body.appendChild(video);

// ------------------------------
// Start camera on tap
// ------------------------------
document.body.addEventListener("click", async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = stream;
    statusEl.textContent = "Camera OK — detecting hands…";
    startDetection();
  } catch (err) {
    statusEl.textContent = "Camera error: " + err.name;
  }
});

// ------------------------------
// Simple Hand Detection (No MediaPipe)
// ------------------------------
let lastFrame = null;

function startDetection() {
  function loop() {
    if (video.readyState >= 2) {
      detectHands();
    }
    requestAnimationFrame(loop);
  }
  loop();
}

function detectHands() {
  const w = canvas.width;
  const h = canvas.height;
  const half = w / 2;

  // Draw split-screen video
  ctx.drawImage(video, 0, 0, half, h);
  ctx.drawImage(video, half, 0, half, h);

  // Get frame data
  const frame = ctx.getImageData(0, 0, w, h);
  const data = frame.data;

  // Create mask for skin detection
  const mask = new Uint8ClampedArray(w * h);

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    // Convert to YCrCb
    const y  = 0.299*r + 0.587*g + 0.114*b;
    const cr = (r - y) * 0.713 + 128;
    const cb = (b - y) * 0.564 + 128;

    // Simple skin color range
    const isSkin =
      cr > 135 && cr < 180 &&
      cb > 85  && cb < 135;

    mask[i / 4] = isSkin ? 255 : 0;
  }

  // Find largest blob (hand)
  let minX = w, minY = h, maxX = 0, maxY = 0;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      if (mask[idx] === 255) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  // Draw outline if hand detected
  if (maxX - minX > 20 && maxY - minY > 20) {
    ctx.strokeStyle = "cyan";
    ctx.lineWidth = 4;
    ctx.strokeRect(minX, minY, maxX - minX, maxY - minY);
  }
}
</script>

</body>
</html>
