<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mobile VR 3D World (Safe Mode)</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  #view {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: black;
  }
</style>
</head>
<body>

<canvas id="view"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const canvas = document.getElementById("view");

// MOBILE‑SAFE WEBGL SETTINGS
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: false,
  alpha: false,
  depth: false,
  stencil: false,
  powerPreference: "low-power"
});

// LOWER INTERNAL RESOLUTION (CRITICAL FIX)
renderer.setSize(window.innerWidth / 2, window.innerHeight / 2, false);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

// Camera
const cam3D = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
cam3D.position.set(0, 1.6, 3);

// Floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshBasicMaterial({ color: 0x444444 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Cube
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshBasicMaterial({ color: 0x00ff00 })
);
cube.position.set(0, 1, -3);
scene.add(cube);

// Movement
let forward = 0;
let strafe = 0;

window.addEventListener("keydown", (e) => {
  if (e.key === "w") forward = 0.1;
  if (e.key === "s") forward = -0.1;
  if (e.key === "a") strafe = -0.1;
  if (e.key === "d") strafe = 0.1;
});
window.addEventListener("keyup", () => {
  forward = 0;
  strafe = 0;
});

// Gyro look
let yaw = 0, pitch = 0;

window.addEventListener("deviceorientation", (e) => {
  yaw = (e.alpha || 0) * Math.PI/180;
  pitch = (e.beta || 0) * Math.PI/180 - Math.PI/2;
});

// Render loop
function render() {
  cam3D.rotation.set(pitch, yaw, 0);

  cam3D.position.x += Math.sin(yaw) * forward + Math.cos(yaw) * strafe;
  cam3D.position.z += Math.cos(yaw) * forward - Math.sin(yaw) * strafe;

  const w = window.innerWidth;
  const h = window.innerHeight;

  renderer.setViewport(0, 0, w/2, h);
  renderer.render(scene, cam3D);

  renderer.setViewport(w/2, 0, w/2, h);
  renderer.render(scene, cam3D);

  requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
