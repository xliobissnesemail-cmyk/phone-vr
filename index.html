<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Camera + Joy-Con Controllers</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }

  #cam {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: cover;
    z-index: 0;
  }

  #view {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
    pointer-events: none;
  }

  #hud {
    position: fixed;
    top: 10px; right: 10px;
    background: rgba(0,0,0,0.6);
    padding: 8px 12px;
    border-radius: 6px;
    color: white;
    font-family: Arial;
    z-index: 2;
  }
</style>
</head>
<body>

<div id="hud">
  <div>v3.0.0-joycon-vr</div>
  <div id="fps">FPS: 0</div>
  <div id="status">Waiting for Joy-Cons...</div>
</div>

<video id="cam" autoplay playsinline muted></video>
<canvas id="view" width="1280" height="720"></canvas>

<script>
const video = document.getElementById("cam");
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const fpsEl = document.getElementById("fps");
const statusEl = document.getElementById("status");

let lastTime = performance.now();
let frames = 0;

// Joy-Con controller data
let leftCon = null;
let rightCon = null;

let leftRot = { yaw: 0, pitch: 0, roll: 0 };
let rightRot = { yaw: 0, pitch: 0, roll: 0 };

let player = { x: 0, z: 0 };

// CAMERA START
document.body.addEventListener("click", async () => {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });
  video.srcObject = stream;
  startLoop();
});

// GAMEPAD CONNECT
window.addEventListener("gamepadconnected", (e) => {
  const pad = e.gamepad;

  if (pad.id.includes("Joy-Con (L)")) {
    leftCon = pad;
    statusEl.textContent = "Left Joy-Con connected!";
  }

  if (pad.id.includes("Joy-Con (R)")) {
    rightCon = pad;
    statusEl.textContent = "Right Joy-Con connected!";
  }
});

// FPS COUNTER
function updateFPS(now) {
  frames++;
  if (now - lastTime >= 1000) {
    fpsEl.textContent = "FPS: " + frames;
    frames = 0;
    lastTime = now;
  }
}

// READ JOY-CON INPUT
function readJoyCons() {
  const pads = navigator.getGamepads();

  for (const pad of pads) {
    if (!pad) continue;

    // Identify left/right Joy-Con
    if (pad.id.includes("Joy-Con (L)")) leftCon = pad;
    if (pad.id.includes("Joy-Con (R)")) rightCon = pad;
  }

  // Movement from right Joy-Con stick
  if (rightCon) {
    const stickX = rightCon.axes[0];
    const stickY = rightCon.axes[1];

    player.x += stickX * 0.1;
    player.z += stickY * 0.1;
  }

  // Rotation from Joy-Con IMU (if supported)
  if (leftCon && leftCon.pose) leftRot = getRotation(leftCon.pose.orientation);
  if (rightCon && rightCon.pose) rightRot = getRotation(rightCon.pose.orientation);
}

// Convert quaternion → Euler angles
function getRotation(q) {
  if (!q) return { yaw: 0, pitch: 0, roll: 0 };

  const yaw = Math.atan2(
    2 * (q.w * q.z + q.x * q.y),
    1 - 2 * (q.y * q.y + q.z * q.z)
  );

  const pitch = Math.asin(
    2 * (q.w * q.y - q.z * q.x)
  );

  const roll = Math.atan2(
    2 * (q.w * q.x + q.y * q.z),
    1 - 2 * (q.x * q.x + q.y * q.y)
  );

  return { yaw, pitch, roll };
}

// DRAW VR CONTROLLERS
function drawController(x, y, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot.yaw);

  ctx.fillStyle = "rgba(0,200,255,0.8)";
  ctx.fillRect(-20, -60, 40, 120);

  ctx.fillStyle = "white";
  ctx.fillRect(-10, -70, 20, 10);

  ctx.restore();
}

// VR DRAW LOOP
function drawVR() {
  const w = canvas.width;
  const h = canvas.height;
  const half = w / 2;

  ctx.clearRect(0, 0, w, h);

  // VR split-screen camera
  ctx.drawImage(video, 0, 0, half, h);
  ctx.drawImage(video, half, 0, half, h);

  // Draw controllers
  drawController(200, 400, leftRot);
  drawController(w - 200, 400, rightRot);
}

// MAIN LOOP
function startLoop() {
  function loop(now) {
    updateFPS(now);
    readJoyCons();
    drawVR();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
</script>

</body>
</html>
