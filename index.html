<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stable VR Viewer</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
    color: white;
    font-family: Arial;
  }
  #view {
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #ui {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.5);
    padding: 8px 12px;
    border-radius: 6px;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="ui">
  <div>Stable VR Hybrid Tracking</div>
  <div id="status">Loading…</div>
</div>

<canvas id="view" width="1280" height="720"></canvas>

<script>
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

// --- CAMERA SETUP ---
const video = document.createElement("video");
video.setAttribute("playsinline", "");
video.setAttribute("autoplay", "");
video.style.display = "none";
document.body.appendChild(video);

navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
  .then(stream => {
    video.srcObject = stream;
    statusEl.textContent = "Camera OK — enabling motion sensors…";
  })
  .catch(err => {
    statusEl.textContent = "Camera error: " + err.name;
  });

// --- MOTION SENSORS ---
let sensorYaw = 0;
let sensorPitch = 0;
let sensorRoll = 0;

function requestSensorPermission() {
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {

    DeviceOrientationEvent.requestPermission().then(response => {
      if (response === "granted") {
        window.addEventListener("deviceorientation", handleOrientation);
        statusEl.textContent = "Camera + Motion sensors active";
      } else {
        statusEl.textContent = "Motion sensor permission denied";
      }
    });

  } else {
    window.addEventListener("deviceorientation", handleOrientation);
    statusEl.textContent = "Camera + Motion sensors active";
  }
}

function handleOrientation(event) {
  sensorYaw   = (event.alpha || 0) * (Math.PI / 180);
  sensorPitch = (event.beta  || 0) * (Math.PI / 180);
  sensorRoll  = (event.gamma || 0) * (Math.PI / 180);
}

setTimeout(requestSensorPermission, 1000);

// --- VIRTUAL CAMERA (NO ROTATION APPLIED TO VIDEO) ---
let vrYaw = 0;
let vrPitch = 0;
let vrRoll = 0;

function updateVirtualCamera() {
  const smooth = 0.1;

  vrYaw   += (sensorYaw   - vrYaw)   * smooth;
  vrPitch += (sensorPitch - vrPitch) * smooth;
  vrRoll  += (sensorRoll  - vrRoll)  * smooth;

  // Clamp pitch to avoid flipping
  const maxPitch = Math.PI / 3;
  vrPitch = Math.max(-maxPitch, Math.min(maxPitch, vrPitch));
}

// --- RENDER SPLIT SCREEN (NO ROTATION) ---
function renderVR() {
  updateVirtualCamera();

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const halfWidth = canvas.width / 2;
  const height = canvas.height;

  if (video.readyState === 4) {
    // Left eye
    ctx.drawImage(video, 0, 0, halfWidth, height);

    // Right eye
    ctx.drawImage(video, halfWidth, 0, halfWidth, height);
  }

  // Debug overlay
  ctx.fillStyle = "lime";
  ctx.font = "16px Arial";
  ctx.fillText("Yaw: " + vrYaw.toFixed(2), 20, 30);
  ctx.fillText("Pitch: " + vrPitch.toFixed(2), 20, 50);
  ctx.fillText("Roll: " + vrRoll.toFixed(2), 20, 70);

  requestAnimationFrame(renderVR);
}

renderVR();
</script>

</body>
</html>
