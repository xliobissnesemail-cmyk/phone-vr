<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VR Hand Tracking</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }
    #view {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>VR Hand Tracking</div>
    <div id="status">Initializing…</div>
  </div>
  <canvas id="view" width="1280" height="720"></canvas>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <script>
    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    // Camera video element
    const video = document.createElement("video");
    video.setAttribute("playsinline", "");
    video.setAttribute("autoplay", "");
    video.style.display = "none";
    document.body.appendChild(video);

    // Get camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => {
        video.srcObject = stream;
        statusEl.textContent = "Camera OK — starting hand tracking…";
      })
      .catch(err => {
        statusEl.textContent = "Camera error: " + err.name;
      });

    // MediaPipe Hands setup
    const hands = new Hands({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
      }
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(onHandsResults);

    // MediaPipe camera helper
    const mpCamera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 1280,
      height: 720
    });

    mpCamera.start();

    function onHandsResults(results) {
      const width = canvas.width;
      const height = canvas.height;
      const half = width / 2;

      // Draw split-screen video
      ctx.clearRect(0, 0, width, height);

      if (results.image) {
        ctx.drawImage(results.image, 0, 0, half, height);
        ctx.drawImage(results.image, half, 0, half, height);
      }

      // Draw hand outlines on top
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        ctx.lineWidth = 4;
        ctx.strokeStyle = "cyan";
        ctx.fillStyle = "white";

        for (const landmarks of results.multiHandLandmarks) {
          // Draw on full canvas (centered)
          drawHandOutline(landmarks, width, height);
        }
      }

      statusEl.textContent = "Hand tracking active";
    }

    function drawHandOutline(landmarks, width, height) {
      // landmarks are normalized [0..1]
      // We’ll draw simple lines between key points
      ctx.beginPath();
      for (let i = 0; i < landmarks.length; i++) {
        const x = landmarks[i].x * width;
        const y = landmarks[i].y * height;
        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.closePath();
      ctx.stroke();

      // Draw small circles at each landmark
      for (let i = 0; i < landmarks.length; i++) {
        const x = landmarks[i].x * width;
        const y = landmarks[i].y * height;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  </script>
</body>
</html>
